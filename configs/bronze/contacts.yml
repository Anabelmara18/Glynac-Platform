table: contacts
source: salesforce
path_glob: salesforce/contacts/*/*/data.orc
format: ORC
partitions:
- name: organisation_id
  type: String
  path_segment_from_end: 3
- name: processing_date
  type: Date
  path_segment_from_end: 2
columns:
- name: contact_id
  type: String
- name: first_name
  type: String
- name: last_name
  type: String
- name: email
  type: String
- name: phone
  type: String
- name: city
  type: String
- name: risk_profile
  type: String
- name: created_at
  type: DateTime64(6)
- name: updated_at
  type: DateTime64(6)
