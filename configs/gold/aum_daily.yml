name: aum_daily
description: Assets under management per organisation per day (a SNAPSHOT total).
depends_on: [holdings, portfolios]
engine: ReplacingMergeTree
engine_args: "_loaded_at"
engine_rationale: >
  AUM is a point-in-time total, not an additive flow. Re-running a day must
  REPLACE the number, never add to it. SummingMergeTree would double-count a
  re-run; ReplacingMergeTree keeps the newest row for the same key.
partition_by: toYYYYMMDD(processing_date)
order_by: [organisation_id, processing_date]
columns:
  - {name: organisation_id, type: String}
  - {name: processing_date, type: Date}
  - {name: total_aum, type: "Decimal(38, 2)"}
  - {name: accounts_with_holdings, type: UInt64}
  - {name: portfolios, type: UInt64}
  - {name: holdings, type: UInt64}
  - {name: _loaded_at, type: "DateTime64(3)", default: "now64(3)"}
select: |
  SELECT
    h.organisation_id AS organisation_id,
    toDate('{day}') AS processing_date,
    sum(h.market_value) AS total_aum,
    uniqExact(p.account_id) AS accounts_with_holdings,
    uniqExact(h.portfolio_id) AS portfolios,
    count() AS holdings
  FROM (SELECT * FROM silver.holdings FINAL WHERE processing_date = toDate('{day}')) AS h
  INNER JOIN (SELECT organisation_id, portfolio_id, account_id FROM silver.portfolios FINAL
              WHERE processing_date = toDate('{day}')) AS p
    ON p.organisation_id = h.organisation_id AND p.portfolio_id = h.portfolio_id
  GROUP BY h.organisation_id
# must return 0: gold per-org AUM equals an independent recompute from Silver
reconcile: |
  SELECT count() AS mismatches FROM (
    SELECT g.organisation_id AS o, g.total_aum AS gold_aum, s.silver_aum AS silver_aum
    FROM (SELECT organisation_id, total_aum FROM gold.aum_daily FINAL WHERE processing_date = toDate('{day}')) AS g
    FULL OUTER JOIN (SELECT hh.organisation_id AS organisation_id, sum(hh.market_value) AS silver_aum
                     FROM (SELECT * FROM silver.holdings FINAL WHERE processing_date = toDate('{day}')) AS hh
                     INNER JOIN (SELECT organisation_id, portfolio_id FROM silver.portfolios FINAL
                                 WHERE processing_date = toDate('{day}')) AS pp
                       ON pp.organisation_id = hh.organisation_id AND pp.portfolio_id = hh.portfolio_id
                     GROUP BY hh.organisation_id) AS s
      ON s.organisation_id = g.organisation_id
    WHERE g.total_aum != s.silver_aum)
